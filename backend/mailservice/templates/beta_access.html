<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiuli Beta Access</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FAF6ED; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table width="100%" border="0" cellspacing="0" cellpadding="0" style="background-color: #FAF6ED; padding: 20px;">
    <tr>
      <td align="center">
        <table width="100%" max-width="600" border="0" cellspacing="0" cellpadding="0" style="max-width: 600px; background-color: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid #E5B05C;">
          <!-- Header -->
          <tr>
            <td align="center" style="background-color: #3D0D11; padding: 40px 20px;">
              <h1 style="color: #E5B05C; margin: 0; font-size: 28px; letter-spacing: 2px;">SHIULI</h1>
              <p style="color: #FAF6ED; margin: 10px 0 0 0; font-size: 14px; letter-spacing: 4px; text-transform: uppercase;">BETA ACCESS</p>
            </td>
          </tr>
          
          <!-- Body -->
          <tr>
            <td style="padding: 40px 30px;">
              <p style="color: #3D0D11; font-size: 16px; line-height: 1.5; margin: 0 0 20px 0;">Hello <strong>{{name}}</strong>,</p>
              <p style="color: #5C4D43; font-size: 16px; line-height: 1.6; margin: 0 0 30px 0;">You're invited to experience Shiuli before the public launch.</p>
              
              <table width="100%" border="0" cellspacing="0" cellpadding="0">
                <tr>
                  <td align="center">
                    <p style="color: #7A1F26; font-size: 12px; font-weight: bold; letter-spacing: 2px; margin: 0 0 15px 0; text-transform: uppercase;">YOUR BETA ACCESS PIN</p>
                  </td>
                </tr>
                <tr>
                  <td align="center">
                    <!-- PIN Boxes -->
                    <table border="0" cellspacing="0" cellpadding="0" style="margin-bottom: 30px;">
                      <tr>
                        <td align="center" width="40" height="50" style="background-color: #FAF6ED; border: 2px solid #E5B05C; border-radius: 8px; font-size: 24px; font-weight: bold; color: #3D0D11; text-align: center;">{{pin_1}}</td>
                        <td width="10"></td>
                        <td align="center" width="40" height="50" style="background-color: #FAF6ED; border: 2px solid #E5B05C; border-radius: 8px; font-size: 24px; font-weight: bold; color: #3D0D11; text-align: center;">{{pin_2}}</td>
                        <td width="10"></td>
                        <td align="center" width="40" height="50" style="background-color: #FAF6ED; border: 2px solid #E5B05C; border-radius: 8px; font-size: 24px; font-weight: bold; color: #3D0D11; text-align: center;">{{pin_3}}</td>
                        <td width="10"></td>
                        <td align="center" width="40" height="50" style="background-color: #FAF6ED; border: 2px solid #E5B05C; border-radius: 8px; font-size: 24px; font-weight: bold; color: #3D0D11; text-align: center;">{{pin_4}}</td>
                        <td width="10"></td>
                        <td align="center" width="40" height="50" style="background-color: #FAF6ED; border: 2px solid #E5B05C; border-radius: 8px; font-size: 24px; font-weight: bold; color: #3D0D11; text-align: center;">{{pin_5}}</td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td align="center">
                    <a href="{{beta_url}}" style="display: inline-block; background-color: #7A1F26; color: #FAF6ED; text-decoration: none; padding: 14px 28px; border-radius: 8px; font-size: 14px; font-weight: bold; letter-spacing: 1px; border: 1px solid #E5B05C;">ENTER BETA ACCESS →</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          
          <!-- Footer -->
          <tr>
            <td align="center" style="background-color: #FAF6ED; padding: 20px; border-top: 1px solid #E5B05C;">
              <p style="margin: 0; color: #A67C52; font-size: 12px;">© Shiuli. All rights reserved.</p>
              <p style="margin: 5px 0 0 0; color: #A67C52; font-size: 11px;">Kolkata, West Bengal, India</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
